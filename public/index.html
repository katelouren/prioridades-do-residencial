<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Consulte propostas, participe e acompanhe o retorno da gestão do residencial.">
  <title>Prioridades do Residencial</title>
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/assistant.css">
  <script src="/assistant.js" defer></script>
  <script src="/app.js" defer></script>
</head>
<body>
  <a class="skip" href="#main">Ir para o conteúdo</a>
  <header class="top">
    <div class="top-inner">
      <div class="brand"><span class="brand-mark" aria-hidden="true">PR</span><div><span>Prioridades do Residencial</span><small id="residential-name">Participar e acompanhar</small></div></div>
      <div class="account"><span id="profile" class="profile" hidden></span><button id="logout" class="header-button" hidden>Sair</button></div>
    </div>
  </header>
  <div id="navigation"></div>
  <header id="admin-header" class="admin-header" hidden>
    <button id="admin-menu" class="secondary" type="button" aria-controls="navigation" aria-expanded="false">Menu</button>
    <span id="admin-section-name"></span><span class="admin-header-profile">Gestão · Demonstração</span>
  </header>
  <button id="admin-backdrop" class="admin-backdrop" type="button" aria-label="Fechar menu" hidden></button>
  <dialog id="admin-intro" aria-labelledby="admin-intro-title" aria-describedby="admin-intro-text"></dialog>
  <main id="main" tabindex="-1">
    <p id="notice" role="status" aria-live="polite" tabindex="-1"></p>
    <div id="content"></div>
  </main>
  <footer>Demonstração acadêmica · Residencial fictício · GS2 / CitizenTech</footer>
</body>
</html>
